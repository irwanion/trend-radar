name: Daily harvest
on:
  schedule:
    - cron: "30 0 * * *"   # 07:30 Jakarta time, every day
  workflow_dispatch:        # lets you press a "Run workflow" button
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r harvester/requirements.txt
      - run: python harvester/harvest.py
      - name: Save results
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Daily harvest $(date -u +%F)" && git push)
